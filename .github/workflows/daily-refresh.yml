name: Daily data refresh

on:
  schedule:
    # 05:00 AWST (Perth has no daylight saving) = 21:00 UTC the previous day.
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run ingest
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: node scripts/ingest.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "wa-social-leaderboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json snapshots/follower-history.json
          git diff --cached --quiet && echo "No data changes" || git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          git push
